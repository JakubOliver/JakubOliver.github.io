name: Deploy GitHub Pages (with LFS assets)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository and download LFS objects
        uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false

      - name: Verify that Git LFS assets are real files
        shell: bash
        run: |
          set -euo pipefail
          git lfs pull
          if git lfs ls-files --name-only | while IFS= read -r file; do
            if [ ! -f "$file" ]; then
              echo "::error file=$file::LFS asset is missing"
              exit 1
            fi
            if head -c 80 "$file" | grep -aq 'version https://git-lfs.github.com/spec/v1'; then
              echo "::error file=$file::LFS pointer was not hydrated"
              exit 1
            fi
          done; then
            echo "All Git LFS files have been downloaded."
          else
            exit 1
          fi

      - name: Prepare static site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          tar --exclude='./.git' --exclude='./.github' --exclude='./_site' \
              --exclude='./.gitattributes' -cf - . | tar -xf - -C _site
          touch _site/.nojekyll
          test -f _site/index.html
          test -f _site/CNAME

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
